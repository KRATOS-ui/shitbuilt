spring.application.name=PA-SaaS2

# --- Base de datos (todo por variables de entorno; NUNCA escribir contrasenas aqui) ---
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:saas_calendar}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# --- Seguridad: tokens (RNF-03) ---
application.security.jwt.secret-key=${JWT_SECRET}
# Access token: 1 hora. Refresh token: 7 dias.
application.security.jwt.expiration=3600000
application.security.jwt.refresh-expiration=604800000
# Origenes permitidos para CORS (separados por coma)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost,http://localhost:3000,http://localhost:5173,http://localhost:5174}

server.port=8080

# --- IA (CU-03). Timeout acorde al RNF de usabilidad (~5 s) ---
api.gemini.key=${GEMINI_API_KEY:}
api.gemini.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent
api.gemini.timeout-seconds=${GEMINI_TIMEOUT_SECONDS:5}

# --- Correo (RF-08). Si MAIL_HOST esta vacio los correos se registran en el log en vez de enviarse ---
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:no-reply@syncflow.local}
app.mail.enabled=${MAIL_ENABLED:true}

# --- Disponibilidad (RNF) ---
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.health.mail.enabled=false
